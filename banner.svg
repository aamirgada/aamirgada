<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1280"
    height="740"
    viewBox="0 0 1280 740">

<title>Mohd Aamir GitHub Banner</title>

<defs>

<!-- Rounded Clip -->
<clipPath id="bannerClip">
    <rect x="20" y="20" width="1240" height="700" rx="28"/>
</clipPath>

<!-- Animated Background -->
<linearGradient id="bgGradient"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%">

    <stop offset="0%" stop-color="#17081E">
        <animate attributeName="stop-color"
            values="#17081E;#240A39;#17081E"
            dur="8s"
            repeatCount="indefinite"/>
    </stop>

    <stop offset="50%" stop-color="#4D126F">
        <animate attributeName="stop-color"
            values="#4D126F;#A42EFF;#4D126F"
            dur="8s"
            repeatCount="indefinite"/>
    </stop>

    <stop offset="100%" stop-color="#FF4FC8">
        <animate attributeName="stop-color"
            values="#FF4FC8;#B248FF;#FF4FC8"
            dur="8s"
            repeatCount="indefinite"/>
    </stop>

</linearGradient>

<!-- Neon Glow -->
<filter id="glow">

<feGaussianBlur
stdDeviation="6"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

<!-- Strong Glow -->

<filter id="bigGlow">

<feGaussianBlur
stdDeviation="15"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

<!-- Glass Blur -->

<filter id="glass">

<feGaussianBlur stdDeviation="12"/>

</filter>

<!-- Tech Gradient -->

<linearGradient id="pinkPurple">

<stop offset="0%" stop-color="#ff5dcf"/>

<stop offset="100%" stop-color="#9c4dff"/>

<animateTransform
attributeName="gradientTransform"
type="rotate"
from="0 .5 .5"
to="360 .5 .5"
dur="12s"
repeatCount="indefinite"/>

</linearGradient>

</defs>

<g clip-path="url(#bannerClip)">

<!-- Background -->

<rect
width="1280"
height="740"
fill="url(#bgGradient)"/>

<!-- Ambient Glow -->

<circle
cx="980"
cy="160"
r="240"
fill="#ff59c8"
opacity=".10">

<animate
attributeName="r"
values="220;260;220"
dur="7s"
repeatCount="indefinite"/>

</circle>

<circle
cx="270"
cy="610"
r="190"
fill="#9c4dff"
opacity=".10">

<animate
attributeName="r"
values="180;210;180"
dur="9s"
repeatCount="indefinite"/>

</circle>

<!-- Main Glass Panel -->

<rect

x="30"
y="30"
width="1220"
height="680"
rx="26"

fill="#12081d"

fill-opacity=".22"

stroke="#ff66dd"

stroke-opacity=".35"

filter="url(#glow)"/>

</g>

</svg>
